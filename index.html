<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>장로까지 키우기</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--k:#1b1b1b;--red:#e8463a;--yel:#f7d84a;--teal:#2a9d9a;--mint:#d7ecea;--paper:#fffdf7;
        --wob:255px 18px 225px 18px/18px 225px 18px 255px;--wob2:18px 225px 18px 255px/255px 18px 225px 18px;--wobB:22px 30px 20px 32px/30px 20px 32px 22px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  body{margin:0;font-family:'Gaegu',sans-serif;font-weight:700;color:var(--k);background:var(--paper);min-height:100vh;display:flex;justify-content:center;
       background-image:radial-gradient(#e9e3d6 1.2px,transparent 1.3px);background-size:18px 18px}
  .app{width:100%;max-width:440px;padding:14px 14px 24px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .logo{width:56px;height:56px;border-radius:var(--wob);background:#fff;border:3px solid var(--k);box-shadow:3px 3px 0 var(--k);display:flex;align-items:center;justify-content:center}
  .logo svg{width:40px;height:40px}
  h1{font-size:30px;margin:0;line-height:1}
  .sub{font-size:14px;color:#6a6a6a;font-weight:400}
  .help{margin-left:auto;width:44px;height:44px;border-radius:50%;border:3px solid var(--k);background:var(--yel);font-family:'Gaegu';font-weight:700;font-size:24px;color:var(--k);box-shadow:2px 2px 0 var(--k)}
  .shell{background:var(--mint);border-radius:var(--wobB);padding:14px 14px 18px;border:3px solid var(--k);box-shadow:5px 5px 0 var(--k)}
  .shell .top{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:0 6px 10px}
  .stamp{background:var(--red);color:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;text-align:center;border:2px solid var(--k);transform:rotate(-12deg)}
  .screen{background:#fff;border-radius:var(--wobB);overflow:hidden;border:3px solid var(--k)}
  .info{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:3px dashed var(--k)}
  .lv{background:var(--teal);color:#fff;border:2.5px solid var(--k);border-radius:var(--wob);padding:3px 9px;font-size:18px}
  .nm{font-size:24px;line-height:1}
  .nm small{display:block;font-size:14px;color:#777;font-weight:400}
  .pts{margin-left:auto;text-align:right;font-size:13px;color:#777}
  .pts b{display:inline-block;font-size:28px;color:var(--k);line-height:1;transform-origin:right center}
  .scene{height:290px;position:relative;overflow:hidden;background-image:radial-gradient(rgba(0,0,0,.07) 1.5px,transparent 1.6px);background-size:16px 16px}
  .place{position:absolute;top:10px;left:10px;background:#fff;border:2.5px solid var(--k);border-radius:var(--wob);padding:2px 12px;font-size:18px;z-index:2;box-shadow:2px 2px 0 var(--k)}
  .deco{position:absolute;width:38px;height:38px}
  .deco svg{width:100%;height:100%;overflow:visible}
  .hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:216px;cursor:pointer;z-index:1}
  .hero svg{width:100%;height:100%;display:block;overflow:visible}
  .hero.tap{animation:tap .18s}
  .hero.shake{animation:shake .12s infinite}
  .hero.glow{animation:glow 1s}
  .hero.sad{animation:sad .8s}
  @keyframes tap{50%{transform:translate(-50%,-50%) scale(.9,1.06)}}
  @keyframes shake{0%,100%{transform:translate(-50%,-50%) rotate(-6deg)}50%{transform:translate(-50%,-50%) rotate(6deg)}}
  @keyframes glow{50%{transform:translate(-50%,-50%) scale(1.2) rotate(-4deg)}}
  @keyframes sad{30%{transform:translate(-50%,-30%) scale(.7) rotate(12deg);opacity:.4}}
  .caption{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#fff;border:2.5px solid var(--k);border-radius:var(--wob);padding:3px 14px;font-size:18px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:2;box-shadow:2px 2px 0 var(--k)}
  .float{position:absolute;font-size:24px;color:var(--red);-webkit-text-stroke:.6px var(--k);animation:up .9s forwards;pointer-events:none;z-index:3;white-space:nowrap}
  @keyframes up{to{transform:translateY(-70px) rotate(-6deg);opacity:0}}
  .verse{position:absolute;inset:0;background:var(--paper);z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 22px;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;
         background-image:linear-gradient(transparent 31px,#cfe6e4 32px);background-size:100% 32px}
  .verse.on{opacity:1;pointer-events:auto}
  .verse .vi svg{width:54px;height:44px}
  .verse .vt{font-size:21px;line-height:1.5;margin-top:4px}
  .verse .vr{color:var(--teal);margin-top:8px;font-size:18px}
  .verse .vb{width:70%;height:9px;background:#fff;border:2px solid var(--k);border-radius:9px;margin-top:12px;overflow:hidden}
  .verse .vb i{display:block;height:100%;background:var(--yel);width:100%}
  .slipbox{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:#2a1d22;color:#fff;opacity:0;pointer-events:none;transition:opacity .25s;
           background-image:radial-gradient(rgba(232,70,58,.35) 2px,transparent 2.2px);background-size:18px 18px}
  .slipbox.on{opacity:1;animation:quake .35s}
  @keyframes quake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .slipbox .si svg{width:70px;height:70px}
  .slipbox .sw{font-size:19px;color:#f6c7c2;margin-top:4px;font-weight:400}
  .slipbox .st{font-size:23px;white-space:nowrap;margin-top:8px;background:var(--red);border:2.5px solid #fff;border-radius:var(--wob);padding:0 12px}
  .slipbox .sl{font-size:30px;color:var(--yel);margin-top:6px}
  .evo{padding:10px 12px 12px;border-top:3px dashed var(--k)}
  .evo .row{display:flex;justify-content:space-between;font-size:18px}
  .evo .row span:first-child{color:var(--teal)}
  .bar{height:16px;border-radius:var(--wob);background:#fff;margin:6px 0;overflow:hidden;border:2.5px solid var(--k)}
  .bar i{display:block;height:100%;transition:width .25s;border-right:2.5px solid var(--k);
         background:repeating-linear-gradient(-45deg,var(--yel) 0 8px,#fbe78d 8px 16px);background-size:22.6px 22.6px;animation:stripe .8s linear infinite}
  @keyframes stripe{to{background-position:22.6px 0}}
  .evo .meta{font-size:15px;color:#666;display:flex;justify-content:space-between;font-weight:400}
  .controls{display:flex;align-items:center;gap:12px;margin-top:18px}
  .bible{width:88px;height:88px;border-radius:50%;border:3px solid var(--k);background:var(--teal);color:#fff;font-family:'Gaegu';font-weight:700;font-size:17px;box-shadow:3px 4px 0 var(--k);cursor:pointer;line-height:1}
  .bible svg{display:block;width:40px;height:32px;margin:0 auto 2px;animation:flip 3.5s ease-in-out infinite}
  @keyframes flip{0%,80%,100%{transform:rotateY(0)}90%{transform:rotateY(180deg)}}
  .bible:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--k)}
  .bible:disabled{opacity:.5}
  .touch{flex:1;font-family:'Gaegu';font-weight:700;font-size:32px;color:#fff;background:var(--red);border:3px solid var(--k);border-radius:var(--wob);padding:14px 0;box-shadow:4px 5px 0 var(--k);cursor:pointer;text-shadow:2px 2px 0 var(--k);animation:bounce 1.6s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.5deg) scale(1.02)}}
  .touch:active{animation:none;transform:translate(3px,4px);box-shadow:1px 1px 0 var(--k)}
  .touch:disabled{opacity:.55;animation:none}
  .hint{text-align:center;font-size:15px;color:#555;margin-top:10px;font-weight:400}
  .rec{display:flex;justify-content:space-around;margin-top:16px;font-size:15px;color:#666;text-align:center;font-weight:400}
  .rec>div{background:#fff;border:2.5px solid var(--k);border-radius:var(--wob);padding:4px 10px;box-shadow:2px 2px 0 var(--k)}
  .rec b{display:block;font-size:20px;color:var(--k);font-weight:700}
  .modal{position:fixed;inset:0;background:rgba(27,27,27,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:9}
  .modal.on{display:flex}
  .box{background:#fff;border:3px solid var(--k);border-radius:var(--wobB);box-shadow:6px 6px 0 var(--k);padding:20px;max-width:360px;width:100%;text-align:center;animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
  @keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
  .mini{width:104px;height:150px;margin:0 auto}.mini svg{width:100%;height:100%;overflow:visible}
  .big svg{width:80px;height:80px}
  .ribbon{display:inline-block;background:var(--yel);border:3px solid var(--k);padding:2px 22px;font-size:28px;margin:8px 0 4px;transform:rotate(-3deg);
          clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%)}
  .ribbon.r{background:var(--red);color:#fff}
  .box p{line-height:1.45;margin:8px 0;font-size:19px;font-weight:400}
  .box p b{font-weight:700}
  .qv{background:var(--paper);border:2px dashed var(--k);border-radius:10px;padding:8px 12px;text-align:left;font-size:17px;margin:10px 0;font-weight:400}
  .ok{font-family:'Gaegu';font-weight:700;font-size:24px;border:3px solid var(--k);border-radius:var(--wob);background:var(--red);color:#fff;padding:8px;width:100%;box-shadow:3px 4px 0 var(--k);margin-top:8px}
  .chance{display:inline-block;background:var(--mint);border:2px solid var(--k);border-radius:10px;padding:1px 10px;font-size:17px}

  .beads{display:flex;gap:7px;justify-content:center;margin-top:16px}
  .beads i{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--k);background:#fff;box-shadow:1px 2px 0 var(--k)}
  .beads i.on{background:var(--yel);animation:beadpop .3s}
  .beads.full i{background:var(--red);animation:beadglow .6s ease-in-out infinite alternate}
  @keyframes beadpop{50%{transform:scale(1.35) rotate(-10deg)}}
  @keyframes beadglow{to{transform:translateY(-3px)}}
  .touch.pray{background:var(--yel);color:var(--k);text-shadow:none}
  .touch.ready{animation:ready .45s ease-in-out infinite alternate}
  @keyframes ready{from{transform:rotate(-2deg) scale(1)}to{transform:rotate(2deg) scale(1.05)}}
  .touch small{font-size:18px}
  /* ===== 애니메이션 ===== */
  .logo{animation:wig 3.5s ease-in-out infinite}
  @keyframes wig{0%,30%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(10deg)}}
  .stamp{animation:stampy 2.4s ease-in-out infinite}
  @keyframes stampy{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(-4deg) scale(1.08)}}
  .hero svg{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-7px) scale(1.015,.99)}}
  .hero .eyes{animation:eyeblink 4s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes eyeblink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
  .hero .armL{animation:wave 2.6s ease-in-out infinite;transform-box:view-box;transform-origin:30px 112px}
  .hero .armR{animation:wave 2.6s ease-in-out infinite reverse;transform-box:view-box;transform-origin:90px 112px}
  @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
  .deco{animation:floaty 3.2s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-10px) rotate(8deg)}}
  .dots{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .dots i{position:absolute;bottom:-20px;font-style:normal;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(-320px) rotate(180deg);opacity:0}}
  .scene.enter{animation:enter .7s ease-out}
  @keyframes enter{0%{transform:scale(1.15) rotate(-3deg);filter:brightness(1.6)}60%{transform:scale(.98) rotate(1deg)}100%{transform:none;filter:none}}
  .coin{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--yel);border:2.5px solid var(--k);font-size:15px;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:3;animation:coin .9s cubic-bezier(.2,.6,.4,1) forwards}
  @keyframes coin{0%{transform:translate(0,0) rotate(0) scale(.5);opacity:1}40%{transform:translate(calc(var(--dx)*.6),-85px) rotate(200deg) scale(1.05)}100%{transform:translate(var(--dx),50px) rotate(400deg) scale(.8);opacity:0}}
  .pts b.pop{animation:pp .25s}
  @keyframes pp{50%{transform:scale(1.25) rotate(-4deg);color:var(--red)}}
  .caption.new{animation:capIn .3s ease-out}
  @keyframes capIn{from{transform:translate(-50%,12px) rotate(-3deg);opacity:0}}
  .place{animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  .confetti{position:fixed;top:-20px;width:11px;height:15px;border:2px solid var(--k);border-radius:3px;z-index:10;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(115vh) rotate(800deg)}}
  .verse.on .vi{animation:bob 1.6s ease-in-out infinite}
  .slipbox .si{animation:devil .5s ease-in-out infinite alternate}
  @keyframes devil{from{transform:rotate(-10deg) scale(1)}to{transform:rotate(10deg) scale(1.15)}}
  .box .mini svg,.box .big svg{animation:bob 1.4s ease-in-out infinite}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" id="logo"></div>
    <div><h1>장로까지 키우기</h1><div class="sub">새가족부터 장로까지 · 터치해서 헌금!</div></div>
    <button class="help" id="help">?</button>
  </header>
  <div class="shell">
    <div class="top"><span>✦ 교회 생활 다이어리 ✦</span><span class="stamp">헌금<br>GO!</span></div>
    <div class="screen">
      <div class="info">
        <span class="lv" id="lv">LV.1</span>
        <div class="nm" id="nm"></div>
        <div class="pts">MY 헌금<br><b id="pts">0</b></div>
      </div>
      <div class="scene" id="scene">
        <div class="dots" id="dots"></div>
        <span class="place" id="place"></span><div id="decos"></div>
        <div class="hero" id="hero"></div>
        <div class="caption" id="cap"></div>
        <div class="slipbox" id="slip"><div class="si" id="devil"></div><div class="sw" id="sWhisper"></div><div class="st">사탄의 속삭임에 넘어갔다!</div><div class="sl" id="sLoss"></div></div>
        <div class="verse" id="verse"><div class="vi" id="vIcon"></div><div class="vt" id="vText"></div><div class="vr" id="vRef"></div><div class="vb"><i id="vBar"></i></div></div>
      </div>
      <div class="evo">
        <div class="row"><span>성장 게이지</span><span id="need"></span></div>
        <div class="bar"><i id="bar"></i></div>
        <div class="meta"><span id="stg"></span><span id="rate"></span></div>
      </div>
    </div>
    <div class="beads" id="beads"></div>
    <div class="controls">
      <button class="bible" id="bible"><span id="bIcon"></span>성경 읽기</button>
      <button class="touch" id="touch">기도하기</button>
    </div>
    <div class="hint">기도 7번 → 헌금 1번 · 다 차면 자동 승급!</div>
  </div>
  <div class="rec">
    <div>최고 직분<b id="best">-</b></div>
    <div>도루묵<b id="fails">0</b></div>
    <div>실족<b id="slips">0</b></div>
    <div>장립<b id="clears">0</b></div>
  </div>
</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
const K="#1b1b1b",RED="#e8463a",YEL="#f7d84a",TEAL="#2a9d9a",W="#ffffff";
let fid=0;
function wobble(){const id="w"+(fid++);return [id,`<filter id="${id}" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="${fid%7+1}"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>`]}

// ── 손그림 낙서 소품 ──
function doodle(t,c){
 const sw=`stroke="${K}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"`;
 let s="";
 if(t==="spark")s=`<path d="M18 2 Q20 16 34 18 Q20 20 18 34 Q16 20 2 18 Q16 16 18 2Z" fill="${c}" ${sw}/>`;
 if(t==="heart")s=`<path d="M18 32 C3 22 3 9 11 7 C15 6 18 9 18 12 C18 9 21 6 25 7 C33 9 33 22 18 32Z" fill="${c}" ${sw}/>`;
 if(t==="note")s=`<ellipse cx="12" cy="27" rx="6.5" ry="5" fill="${c}" ${sw}/><path d="M18 27 V5 Q27 8 29 16" fill="none" ${sw}/>`;
 if(t==="star")s=`<path d="M18 3 L22 13 L33 14 L25 21 L27 32 L18 26 L9 32 L11 21 L3 14 L14 13Z" fill="${c}" ${sw}/>`;
 if(t==="flower")s=[0,72,144,216,288].map(a=>`<circle cx="${18+9*Math.cos(a*Math.PI/180)}" cy="${18+9*Math.sin(a*Math.PI/180)}" r="7" fill="${c}" ${sw}/>`).join("")+`<circle cx="18" cy="18" r="5.5" fill="${YEL}" ${sw}/>`;
 if(t==="moon")s=`<path d="M24 4 A15 15 0 1 0 33 25 A11 11 0 1 1 24 4Z" fill="${c}" ${sw}/>`;
 if(t==="cup")s=`<path d="M6 14 H26 V26 Q26 32 20 32 H12 Q6 32 6 26Z" fill="${c}" ${sw}/><path d="M26 17 Q33 17 32 22 Q31 26 26 25" fill="none" ${sw}/><path d="M12 10 Q10 6 13 3 M19 10 Q17 6 20 3" fill="none" ${sw}/>`;
 if(t==="cross")s=`<path d="M14 3 H22 V11 H31 V19 H22 V34 H14 V19 H5 V11 H14Z" fill="${c}" ${sw}/>`;
 if(t==="bowl")s=`<path d="M4 17 H32 Q31 32 18 32 Q5 32 4 17Z" fill="${c}" ${sw}/><path d="M7 17 Q8 8 18 8 Q28 8 29 17" fill="${W}" ${sw}/>`;
 if(t==="candle")s=`<rect x="12" y="14" width="12" height="19" rx="2" fill="${c}" ${sw}/><path d="M18 3 Q24 9 18 13 Q12 9 18 3Z" fill="${YEL}" ${sw}/>`;
 return `<svg viewBox="0 0 36 36">${s}</svg>`;
}
function churchSVG(){
 const sw=`stroke="${K}" stroke-width="2.5" stroke-linejoin="round"`;
 return `<svg viewBox="0 0 40 40"><path d="M20 2 V9 M16.5 5 H23.5" stroke="${K}" stroke-width="2.5" stroke-linecap="round"/><path d="M11 18 L20 9 L29 18 V36 H11Z" fill="${W}" ${sw}/><path d="M4 24 L11 18 V36 H4Z M36 24 L29 18 V36 H36Z" fill="${TEAL}" ${sw}/><path d="M16 36 V28 Q20 24 24 28 V36" fill="${RED}" ${sw}/><circle cx="20" cy="19" r="3" fill="${YEL}" ${sw}/></svg>`;
}
function bookSVG(){
 const sw=`stroke="${K}" stroke-width="2.5" stroke-linejoin="round"`;
 return `<svg viewBox="0 0 50 40"><path d="M25 8 Q14 2 3 6 V34 Q14 30 25 36 Z" fill="${W}" ${sw}/><path d="M25 8 Q36 2 47 6 V34 Q36 30 25 36 Z" fill="${W}" ${sw}/><path d="M12 13 V25 M8 17 H16" stroke="${RED}" stroke-width="2.5" stroke-linecap="round"/><path d="M31 13 H41 M31 19 H41 M31 25 H38" stroke="${K}" stroke-width="2" stroke-linecap="round"/></svg>`;
}
function devilSVG(){
 const sw=`stroke="${K}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
 return `<svg viewBox="0 0 70 70"><path d="M14 22 L8 4 L26 14Z M56 22 L62 4 L44 14Z" fill="${RED}" ${sw}/><circle cx="35" cy="38" r="25" fill="${RED}" ${sw}/><path d="M20 30 L30 35 M50 30 L40 35" ${sw}/><circle cx="27" cy="39" r="3.5" fill="${K}"/><circle cx="43" cy="39" r="3.5" fill="${K}"/><path d="M22 47 Q35 60 48 47 Q35 52 22 47Z" fill="${W}" ${sw}/></svg>`;
}

// ── 직분별 일상 복장 캐릭터 (손그림 스타일) ──
const OUTFIT=[
 {top:'tee',main:YEL,pants:TEAL,hair:'#7a5236'},
 {top:'shirt',main:W,pants:'#e8d6a8',hair:'#7a5236'},
 {top:'cardigan',main:TEAL,pants:'#6b6b70',hair:'#7a5236'},
 {top:'suit',main:'#a7afb8',pants:'#8f97a1',tie:RED,hair:'#7a5236'},
 {top:'suit',main:'#2b3a5c',pants:'#24304c',tie:RED,hair:'#d6d1cb'}
];
function avatar(r){
 const o=OUTFIT[r],skin='#fff6ec';
 const sw=`stroke="${K}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
 const thin=`stroke="${K}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"`;
 const [fidName,filt]=wobble();
 let s="";
 // 다리·신발
 s+=`<path d="M38 150 V194 H56 V150Z M64 150 V194 H82 V150Z" fill="${o.pants}" ${sw}/>`;
